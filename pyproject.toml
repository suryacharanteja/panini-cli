[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panini-cli"
dynamic = ["version"]
description = "PANINI CLI: a cost-aware terminal coding agent that routes each task between a local Ollama model and OpenAI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["cli", "coding-agent", "ollama", "openai", "llm-router", "qwen", "agent"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Topic :: Software Development",
]
dependencies = [
  "openai>=2.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "rich>=13.0",
  "prompt_toolkit>=3.0",
  "flatbuffers>=25.12.19",
  "regex>=2026.9.29",
  "anyio>=4.14.2",
  "pygments>=2.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
benchmark = ["harbor==0.24.0"]

[project.scripts]
panini-cli = "panini_cli.agent.cli:main"
panini = "panini_cli.agent.cli:main"
panini-engine = "panini_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["panini_cli.panini-sandbox*"]

[tool.setuptools.dynamic]
version = { attr = "panini_cli.agent.VERSION" }

[tool.setuptools.package-data]
"panini_cli.jev" = ["sidecar/*.mjs", "sidecar/package.json"]
"panini_cli" = ["panini-sandbox/runtime/win-*/*.exe", "panini-sandbox/runtime/win-*/*.dll", "panini-sandbox/runtime/win-*/build.json", "panini-sandbox/runtime/win-*/LICENSE.md", "licenses/*.txt", "licenses/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B023"]
