[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panini-cli"
version = "1.1.0"
description = "PANINI-CLI: a local-first terminal coding agent that routes each task to Ollama or OpenAI through Jev"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["cli", "coding-agent", "ollama", "openai", "llm-router", "qwen", "agent"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Topic :: Software Development",
]
dependencies = [
  "openai>=2.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "rich>=13.0",
  "flatbuffers>=25.12.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
panini-cli = "panini_cli.agent.cli:main"
panini = "panini_cli.agent.cli:main"
panini-engine = "panini_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"panini_cli.jev" = ["sidecar/*.mjs", "sidecar/package.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B023"]
