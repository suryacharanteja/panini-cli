<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">PANINI CLI</title>
  <desc id="d">PANINI CLI: a local-first terminal coding agent. Copper network mark and wordmark on a dark background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f27"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4c9a8"/>
      <stop offset="0.5" stop-color="#d98a5a"/>
      <stop offset="1" stop-color="#a85a34"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb98a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="418" rx="27" fill="none" stroke="#d98a5a" stroke-opacity="0.25"/>

  <!-- P mark: a network of nodes tracing the letter P -->
  <g transform="translate(150 60)">
    <circle cx="110" cy="110" r="120" fill="url(#glow)" opacity="0.35" filter="url(#soft)"/>
    <g stroke="url(#cu)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95">
      <path d="M40 300 L40 40 L120 12 L200 40 L228 110 L200 180 L120 208 L60 190"/>
      <path d="M40 40 L60 120 L40 190 L40 300"/>
      <path d="M120 12 L60 120 L120 208"/>
      <path d="M200 40 L120 110 L200 180"/>
      <path d="M60 120 L120 110 L228 110"/>
      <path d="M120 12 L120 110 L120 208"/>
      <path d="M40 190 L60 190"/>
    </g>
    <g fill="url(#cu)">
      <circle cx="40" cy="40" r="9"/><circle cx="120" cy="12" r="9"/><circle cx="200" cy="40" r="9"/>
      <circle cx="228" cy="110" r="9"/><circle cx="200" cy="180" r="9"/><circle cx="120" cy="208" r="9"/>
      <circle cx="60" cy="190" r="8"/><circle cx="40" cy="190" r="7"/><circle cx="60" cy="120" r="8"/>
      <circle cx="40" cy="300" r="9"/><circle cx="120" cy="110" r="14"/>
    </g>
    <circle cx="120" cy="110" r="24" fill="none" stroke="#ffd9bd" stroke-width="2" opacity="0.8"/>
    <circle cx="120" cy="110" r="7" fill="#fff1e4"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="url(#cu)">
    <text x="470" y="215" font-size="132" font-weight="300" letter-spacing="20">PANINI</text>
    <text x="1010" y="215" font-size="132" font-weight="700" letter-spacing="6" fill="#f4e4d6">CLI</text>
  </g>
  <line x1="474" y1="248" x2="1220" y2="248" stroke="#d98a5a" stroke-opacity="0.45"/>
  <g font-family="'Cascadia Mono',Consolas,'Courier New',monospace" fill="#b8bcc6" font-size="24" letter-spacing="5">
    <text x="474" y="292">LOCAL-FIRST  ·  ROUTED  ·  VERIFIED</text>
  </g>
  <g font-family="'Cascadia Mono',Consolas,'Courier New',monospace" font-size="20">
    <text x="474" y="340" fill="#d98a5a">$</text>
    <text x="500" y="340" fill="#e6e8ee">panini-cli exec "fix the failing test"</text>
    <text x="474" y="374" fill="#7f8595">→ ollama/qwen2.5  ·  gpt-4.1-mini  ·  gpt-4.1   (chosen per task)</text>
  </g>
</svg>
